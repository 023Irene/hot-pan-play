<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hot Pan</title>
  <!-- Заглушка-иконка встроена в страницу: иначе браузер просит favicon.ico и роняет 404 в консоль. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff7a2a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2335302e'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #140d09; overflow: hidden; }
    /* touch-action: none — иначе браузер на телефоне перехватывает свайпы и стик дёргается */
    #game { width: 100%; height: 100%; touch-action: none; }
    canvas { display: block; touch-action: none; }

    /*
      Игра горизонтальная (ответ 10, этап 6). Повернуть экран из браузера
      нельзя — Screen Orientation API работает только в полноэкранном режиме,
      — поэтому в портрете просим повернуть телефон сами. На площадках
      ориентация дополнительно указывается в настройках игры (этап 11).
    */
    #rotate {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      background: #140d09;
      color: #ffd9b3;
      font-family: monospace;
      font-size: 20px;
      text-align: center;
      z-index: 10;
    }
    #rotate .pan { font-size: 56px; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-KEAwb_q-.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="pan">🍳</div>
    <div>поверни телефон</div>
  </div>
</body>
</html>
